name: Bug report
description: Report reproducible incorrect behavior without sensitive data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include real secrets, private source code, or customer data.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction using synthetic data
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [API, Worker, Web dashboard, GitHub App, Scanner, Deployment, Documentation]
    validations:
      required: true
